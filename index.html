<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b4636">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Family Tree">
<title>Family Tree</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<header id="topbar">
  <button id="backBtn" class="iconbtn" aria-label="Back">&#8249;</button>
  <h1 id="title">Family Tree</h1>
  <button id="homeBtn" class="iconbtn" aria-label="Home">&#8962;</button>
</header>
<main id="view"></main>
<nav id="tabs">
  <a href="#/home" data-tab="home"><span>&#8962;</span>Home</a>
  <a href="#/tree" data-tab="tree"><span>&#127795;</span>Tree</a>
  <a href="#/pedigree" data-tab="pedigree"><span>&#9783;</span>Chart</a>
  <a href="#/search" data-tab="search"><span>&#9906;</span>Search</a>
  <a href="#/research" data-tab="research"><span>&#10067;</span>Research</a>
  <a href="#/settings" data-tab="settings"><span>&#9881;</span>Settings</a>
</nav>
<div id="viewer" hidden>
  <button id="viewerClose" aria-label="Close">&times;</button>
  <div id="viewerImgWrap"><img id="viewerImg" alt=""></div>
  <div id="viewerCap"></div>
  <div id="viewerNav"><button id="vPrev">&#8249; Prev</button><span id="vCount"></span><button id="vNext">Next &#8250;</button></div>
</div>
<input type="file" id="fileInput" accept=".json,.zip,application/json,application/zip" hidden>
<script src="./app.js"></script>
</body>
</html>
